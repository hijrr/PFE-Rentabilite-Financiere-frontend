<div class="param-page">
  <div class="param-header">
    <div class="header-title">
      <div class="header-icon">
        <i class="fas fa-cog"></i>
      </div>
      <h1>Paramètres</h1>
    </div>
    <!-- Optionnel : header-actions -->
  </div>

  <div class="sync-container">
    <div class="sync-header">
      <div class="header-icon">
        <i class="fas fa-database"></i>
      </div>
      <div class="header-title">
        <h2>Synchronisation Dolibarr</h2>
        <p>Récupérer les données depuis Dolibarr vers la base locale.</p>
      </div>
    </div>


      <div class="actions">
        <button class="btn-primary" (click)="sync('clients')" [disabled]="isLoadingClients">
          <i [class.fa-spinner]="isLoadingClients" [class.fa-pulse]="isLoadingClients" class="fas"
             [ngClass]="{'fa-cloud-upload-alt': !isLoadingClients, 'fa-spinner': isLoadingClients}"></i>
          {{ isLoadingClients ? 'Synchronisation des clients...' : 'Synchroniser les clients' }}
        </button>

        <button class="btn-primary" (click)="sync('invoices')" [disabled]="isLoadingInvoices">
          <i [class.fa-spinner]="isLoadingInvoices" [class.fa-pulse]="isLoadingInvoices" class="fas"
             [ngClass]="{'fa-file-invoice': !isLoadingInvoices, 'fa-spinner': isLoadingInvoices}"></i>
          {{ isLoadingInvoices ? 'Synchronisation des factures...' : 'Synchroniser les factures' }}
        </button>
      </div>

      <div *ngIf="message" class="alert" [ngClass]="{'alert-success': message.type === 'success', 'alert-error': message.type === 'error'}">
        <i [ngClass]="{'fa-check-circle': message.type === 'success', 'fa-exclamation-circle': message.type === 'error'}"></i>
        {{ message.text }}
      </div>
    </div>
    <!-- Nouvelle section : Gestion des rôles -->
  <div class="roles-container">
    <div class="roles-header">
      <div class="header-icon">
        <i class="fas fa-user-tag"></i>
      </div>
      <div class="header-title">
        <h2>Gestion des rôles</h2>
        <p>Ajouter, modifier ou supprimer les rôles utilisateurs.</p>
      </div>
    </div>

    <div class="roles-card">
      <!-- Formulaire d'ajout / modification -->
      <div class="role-form">
        <div class="form-group">
          <label for="roleName">Nom du rôle</label>
          <input type="text" id="roleName" [(ngModel)]="currentRoleName" class="form-control" placeholder="Ex: Administrateur">
        </div>
         <div class="form-group">
    <label for="roleDescription">Description</label>
    <textarea id="roleDescription" [(ngModel)]="currentRoleDescription" class="form-control" rows="3" placeholder="Description du rôle (ex: Gère les utilisateurs et les paramètres)"></textarea>
  </div>
        <div class="form-actions">
          <button class="btn-primary" (click)="saveRole()" [disabled]="!currentRoleName">
            <i class="fas fa-save"></i>
            {{ editingRoleId ? 'Mettre à jour' : 'Enregistrer' }}
          </button>
          <button *ngIf="editingRoleId" class="btn-secondary" (click)="cancelEdit()">Annuler</button>
        </div>
      </div>

      <!-- Liste des rôles existants -->
      <div class="roles-list">
        <h3>Rôles existants</h3>
        <div *ngIf="rolesLoading" class="loading-spinner">
          <i class="fas fa-spinner fa-pulse"></i> Chargement...
        </div>
        <div *ngIf="!rolesLoading && roles.length === 0" class="no-data">
          Aucun rôle trouvé.
        </div>
        <div *ngFor="let role of roles" class="role-item">
          <div class="role-info">
            <span class="role-name">{{ role.name }}</span>
            <span class="role-id">ID: {{ role.id }}</span>
          </div>
          <div class="role-actions">
            <button class="btn-icon edit" (click)="editRole(role)" title="Modifier">
              <i class="fas fa-edit"></i>
            </button>
            <button class="btn-icon delete" (click)="deleteRole(role.id)" title="Supprimer">
              <i class="fas fa-trash-alt"></i>
            </button>
          </div>
        </div>
      </div>
<div *ngIf="roleMessage" class="alert" [ngClass]="{'alert-success': roleMessage.type === 'success', 'alert-error': roleMessage.type === 'error'}">
        <i [ngClass]="{'fa-check-circle': roleMessage.type === 'success', 'fa-exclamation-circle': roleMessage.type === 'error'}"></i>
        {{ roleMessage.text }}
      </div>
    </div>
     </div>
  </div>
